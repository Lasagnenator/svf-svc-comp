name: SV-COMP benchmark sample

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sample_count:
        description: Number of property runs
        default: "100"

env:
  BENCH_REVISION: svcomp26
  BENCH_DIR: ${{ github.workspace }}/sv-benchmarks
  SAMPLE_COUNT: ${{ github.event.inputs.sample_count || '100' }}
  SEED: ${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-21
          clang-21 --version

      - name: Run tester unit tests
        run: python -m unittest tests.test_tester -v

  benchmark-sample:
    runs-on: ubuntu-26.04
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pysvf bundles LLVM 21, so match the compiler that produces the IR it parses.
      - name: Install clang 21
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          clang --version

      - name: Run smoketest
        run: bash smoketest.sh

      # Only task definitions and property files are cached; C sources are fetched per sample.
      - name: Cache benchmark metadata
        id: bench-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BENCH_DIR }}
          key: sv-benchmarks-${{ env.BENCH_REVISION }}-metadata-v1

      - name: Fetch benchmark metadata
        if: steps.bench-cache.outputs.cache-hit != 'true'
        run: |
          python tests/fetch_benchmarks.py \
            --category reachsafety \
            --category memsafety \
            --metadata-only \
            --revision "$BENCH_REVISION" \
            --dest "$BENCH_DIR" \
            --force

      - name: Select deterministic sample
        run: |
          python tests/tester.py "$BENCH_DIR" "$PWD" \
            --category reachsafety \
            --category memsafety \
            --sample-count "$SAMPLE_COUNT" \
            --seed "$SEED" \
            --dry-run \
            --results-dir "$RUNNER_TEMP/sample"

      - name: Fetch sampled sources
        run: |
          python tests/fetch_benchmarks.py \
            --from-manifest "$RUNNER_TEMP/sample/manifest.json" \
            --dest "$BENCH_DIR"

      - name: Cache CPAchecker
        id: cpa-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/CPAchecker-4.2-unix
          key: cpachecker-4.2

      - name: Install CPAchecker
        if: steps.cpa-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cpa.zip" https://cpachecker.sosy-lab.org/CPAchecker-4.2-unix.zip
          unzip -q "$RUNNER_TEMP/cpa.zip" -d "$RUNNER_TEMP"

      - name: Point tester at CPAchecker
        run: echo "CPACHECKER_HOME=$RUNNER_TEMP/CPAchecker-4.2-unix" >> "$GITHUB_ENV"

      - name: Run benchmark sample
        run: |
          python tests/tester.py "$BENCH_DIR" "$PWD" \
            --category reachsafety \
            --category memsafety \
            --sample-count "$SAMPLE_COUNT" \
            --seed "$SEED" \
            --cpu-limit 15 \
            --wall-limit 25 \
            --validation-wall-limit 60 \
            --results-dir "$RUNNER_TEMP/results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sample-reachsafety-memsafety
          path: ${{ runner.temp }}/results
          retention-days: 14
