name: SV-COMP benchmark sample

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: Meta category to sample
        type: choice
        default: reachsafety
        options: [reachsafety, memsafety, softwaresystems]
      sample_count:
        description: Number of property runs (max 100)
        default: "50"

env:
  BENCH_REVISION: svcomp26
  BENCH_DIR: ${{ github.workspace }}/sv-benchmarks
  CATEGORY: ${{ github.event.inputs.category || 'reachsafety' }}
  SAMPLE_COUNT: ${{ github.event.inputs.sample_count || '50' }}
  SEED: ${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tester unit tests
        run: python -m unittest tests.test_tester -v

  benchmark-sample:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      - name: Validate sample size
        run: |
          if [ "$SAMPLE_COUNT" -gt 100 ]; then
            echo "sample_count must not exceed 100" >&2
            exit 1
          fi

      # Only task definitions and property files are cached; C sources are fetched per sample.
      - name: Cache benchmark metadata
        id: bench-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BENCH_DIR }}
          key: sv-benchmarks-${{ env.BENCH_REVISION }}-metadata-v1

      - name: Fetch benchmark metadata
        if: steps.bench-cache.outputs.cache-hit != 'true'
        run: |
          python tests/fetch_benchmarks.py \
            --category "$CATEGORY" \
            --metadata-only \
            --revision "$BENCH_REVISION" \
            --dest "$BENCH_DIR" \
            --force

      - name: Select deterministic sample
        run: |
          python tests/tester.py "$BENCH_DIR" "$PWD" \
            --category "$CATEGORY" \
            --sample-count "$SAMPLE_COUNT" \
            --seed "$SEED" \
            --dry-run \
            --results-dir "$RUNNER_TEMP/sample"

      - name: Fetch sampled sources
        run: |
          python tests/fetch_benchmarks.py \
            --from-manifest "$RUNNER_TEMP/sample/manifest.json" \
            --dest "$BENCH_DIR"

      - name: Run benchmark sample
        run: |
          python tests/tester.py "$BENCH_DIR" "$PWD" \
            --category "$CATEGORY" \
            --sample-count "$SAMPLE_COUNT" \
            --seed "$SEED" \
            --cpu-limit 15 \
            --wall-limit 25 \
            --results-dir "$RUNNER_TEMP/results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sample-${{ env.CATEGORY }}
          path: ${{ runner.temp }}/results
          retention-days: 14
